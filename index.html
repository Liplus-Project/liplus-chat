<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Li+ Chat</title>
    <script type="module" src="/src/main.ts" defer></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <span class="title">Li+ Chat</span>
        <span id="roster" class="roster">参加者なし</span>
        <label class="who">
          名前
          <input id="display-name" type="text" value="human" spellcheck="false" />
        </label>
        <button id="toggle-diagnostics" type="button" aria-expanded="false">診断</button>
      </header>

      <div id="launcher">
        <select id="tab-select" aria-label="起動するセッション"></select>
        <label class="cwd">
          作業ディレクトリ
          <input id="session-cwd" type="text" spellcheck="false" />
        </label>
        <button id="start-session" type="button">セッション参加</button>
      </div>

      <div id="launch-row">
        <label class="options">
          起動オプション
          <input
            id="launch-options"
            type="text"
            spellcheck="false"
            placeholder="例: --dangerously-skip-permissions"
          />
        </label>
        <span id="launch-preview" class="preview"></span>
      </div>

      <main id="room" aria-live="polite"></main>

      <!-- Diagnostics, not the conversation surface. The room shows what was
           said; this shows the CLI that was launched, as it actually renders.
           Nothing here is read as a message: the room's lines come from the
           channel and from say_to_room, never from this output. -->
      <aside id="diagnostics" hidden>
        <dl class="facts">
          <dt>部屋ソケット</dt>
          <dd id="socket-state">確認中</dd>
          <dt>セッション</dt>
          <dd id="session-state">未起動</dd>
        </dl>

        <div id="terminal" aria-label="セッションの端末"></div>
      </aside>

      <footer id="composer">
        <!-- The addressee is optional. Leaving it on 全体 is a room-wide
             utterance; who answers one of those is the agents' judgment, not
             the room's. The room delivers every utterance to everyone either
             way. -->
        <label class="to">
          宛先
          <select id="to-select">
            <option value="">全体</option>
          </select>
        </label>
        <textarea
          id="input"
          rows="2"
          placeholder="部屋に発言する（Enter で送信 / Shift+Enter で改行）"
        ></textarea>
        <button id="send" type="button">送信</button>
      </footer>

      <div id="status" role="status"></div>
    </div>
  </body>
</html>
